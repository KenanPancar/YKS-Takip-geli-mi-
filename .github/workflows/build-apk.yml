name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build YKS Pro Tracker APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Web Assets & Project
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp -f "index.html" www/index.html
          elif [ -f "YKS_Pro_Tracker.html" ]; then
            cp -f "YKS_Pro_Tracker.html" www/index.html
          fi

          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

          npx cap init "YKS Pro Tracker" "com.yksprotracker.app" --web-dir www
          if [ -d "android" ]; then
            npx cap sync android
          else
            npx cap add android
          fi

          # HTML dosyasını doğrudan Android assets klasörüne yaz
          mkdir -p android/app/src/main/assets/public
          cp -f www/index.html android/app/src/main/assets/public/index.html

          # Uygulama ikonunu yerleştir
          if [ -f "app_icon.png" ]; then
            cp -f "app_icon.png" icon_source.png
          elif [ -f "icon.png" ]; then
            cp -f "icon.png" icon_source.png
          else
            python3 -c "import re, base64; c = open('www/index.html').read(); m = re.search(r'data:image/png;base64,([A-Za-z0-9+/=]+)', c); open('icon_source.png', 'wb').write(base64.b64decode(m.group(1))) if m else None"
          fi

          if [ -f "icon_source.png" ]; then
            find android/app/src/main/res/ -name "ic_launcher*.png" -exec cp -f "icon_source.png" {} \;
            find android/app/src/main/res/ -name "ic_launcher_round.png" -exec cp -f "icon_source.png" {} \;
            find android/app/src/main/res/ -name "ic_launcher_foreground.png" -exec cp -f "icon_source.png" {} \;
          fi

          # Gerekli izinleri ekle
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />' "$MANIFEST"
            fi
            sed -i 's/android:allowBackup="false"/android:allowBackup="true"/g' "$MANIFEST"
          fi

          # versionCode değerini güncelle (önbellek çakışmasını önler)
          BUILD_NUM=$(date +%s)
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i "s/versionCode 1/versionCode $BUILD_NUM/g" "$GRADLE_FILE"
            sed -i "s/versionName \"1.0\"/versionName \"1.0.$BUILD_NUM\"/g" "$GRADLE_FILE"
          fi

          # Stabil Gradle 8.11.1-bin wrapper
          WRAPPER_PROP="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER_PROP" ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-bin.zip|g' "$WRAPPER_PROP"
          fi

          # Kalıcı yerel depolama ayarı
          MAIN_ACTIVITY="android/app/src/main/java/com/yksprotracker/app/MainActivity.java"
          if [ -f "$MAIN_ACTIVITY" ]; then
            cat << 'JAVA' > "$MAIN_ACTIVITY"
          package com.yksprotracker.app;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      if (this.getBridge() != null && this.getBridge().getWebView() != null) {
                          WebSettings settings = this.getBridge().getWebView().getSettings();
                          settings.setDomStorageEnabled(true);
                          settings.setDatabaseEnabled(true);
                          settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                      }
                  } catch (Exception ignored) {}
              }
          }
          JAVA
            sed -i 's/^          //g' "$MAIN_ACTIVITY"
          fi

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace || (echo "Yeniden deneniyor (2/3)..." && sleep 5 && ./gradlew assembleDebug --no-daemon --stacktrace) || (echo "Yeniden deneniyor (3/3)..." && sleep 10 && ./gradlew assembleDebug --no-daemon --stacktrace)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YKS-Pro-Tracker-APK
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
