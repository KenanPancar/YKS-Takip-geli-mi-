name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build YKS Pro Tracker APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web App & Capacitor Project
        run: |
          mkdir -p www
          # Repo kökündeki HTML dosyasını www/index.html olarak kopyala
          if [ -f "YKS_Pro_Tracker.html" ]; then
            cp "YKS_Pro_Tracker.html" www/index.html
          elif [ -f "index.html" ]; then
            cp "index.html" www/index.html
          else
            echo "HTML dosyası aranıyor..."
            cp *.html www/index.html || true
          fi

          # Projeyi başlat ve Capacitor paketlerini kur
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

          # Capacitor Android projesini oluştur
          npx cap init "YKS Pro Tracker" "com.yksprotracker.app" --web-dir www
          npx cap add android

          # Gerekli bildirim ve sistem izinlerini ekle
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />' "$MANIFEST"
          fi

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YKS-Pro-Tracker-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
