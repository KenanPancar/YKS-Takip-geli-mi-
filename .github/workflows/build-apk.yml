name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build YKS Pro Tracker APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Web Assets & Capacitor Android Project
        run: |
          mkdir -p www
          # Repo kökündeki HTML dosyasını www/index.html olarak kopyala
          if [ -f "YKS_Pro_Tracker.html" ]; then
            cp "YKS_Pro_Tracker.html" www/index.html
          elif [ -f "index.html" ]; then
            cp "index.html" www/index.html
          else
            FIRST_HTML=$(ls *.html 2>/dev/null | head -n 1)
            if [ -n "$FIRST_HTML" ]; then
              cp "$FIRST_HTML" www/index.html
            else
              echo "HATA: Depoda hiçbir HTML dosyası bulunamadı! Lütfen index.html dosyanızı repoya yükleyin."
              exit 1
            fi
          fi

          # Projeyi başlat ve Capacitor paketlerini kur
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

          # Capacitor Android platformunu oluştur
          npx cap init "YKS Pro Tracker" "com.yksprotracker.app" --web-dir www
          npx cap add android

          # Gerekli bildirim ve titreşim izinlerini ekle
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />' "$MANIFEST"
            fi
          fi

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YKS-Pro-Tracker-APK
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
