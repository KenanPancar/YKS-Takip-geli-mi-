name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build YKS Pro Tracker APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Web Assets & Project
        run: |
          mkdir -p www
          # Repo kökündeki en güncel HTML dosyasını www/index.html olarak kopyala
          if [ -f "index.html" ]; then
            cp -f "index.html" www/index.html
          elif [ -f "YKS_Pro_Tracker.html" ]; then
            cp -f "YKS_Pro_Tracker.html" www/index.html
          else
            FIRST_HTML=$(ls *.html 2>/dev/null | head -n 1)
            if [ -n "$FIRST_HTML" ]; then
              cp -f "$FIRST_HTML" www/index.html
            else
              echo "HATA: Depoda hiçbir HTML dosyası bulunamadı! index.html dosyasını yükleyin."
              exit 1
            fi
          fi

          # KOPYALAMA HATASI KORUMASI: Eğer HTML dosyasının başında veya sonunda kazara ```html veya ``` kalmışsa otomatik temizle
          python3 -c "
          p = 'www/index.html'
          txt = open(p, 'r', encoding='utf-8', errors='ignore').read().strip()
          import re
          txt = re.sub(r'^`{3,}\s*(?:html)?\s*', '', txt, flags=re.IGNORECASE)
          txt = re.sub(r'\s*`{3,}\s*$', '', txt)
          open(p, 'w', encoding='utf-8').write(txt)
          print('HTML baslik kontrolu tamamlandi, ilk 30 karakter:', repr(txt[:30]))
          "

          # Capacitor kurulumu
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

          # Android platformunu hazırla
          npx cap init "YKS Pro Tracker" "com.yksprotracker.app" --web-dir www
          if [ -d "android" ]; then
            echo "Mevcut android platformu senkronize ediliyor..."
            npx cap sync android
          else
            echo "Yeni android platformu olusturuluyor..."
            npx cap add android
          fi

          # KESİN VE ZORUNLU KOPYALAMA: En güncel HTML dosyasını doğrudan Android assets klasörüne yaz
          mkdir -p android/app/src/main/assets/public
          cp -f www/index.html android/app/src/main/assets/public/index.html
          echo "www/index.html basariyla android/app/src/main/assets/public/index.html icine yazildi."

          # Uygulama ikonunu hazirla ve Android klasorlerine yerlestir
          if [ -f "app_icon.png" ]; then
            echo "app_icon.png bulundu."
            cp -f "app_icon.png" icon_source.png
          elif [ -f "icon.png" ]; then
            echo "icon.png bulundu."
            cp -f "icon.png" icon_source.png
          else
            echo "HTML dosyasindan gomulu ikon cikartiliyor..."
            python3 -c "import re, base64; c = open('www/index.html').read(); m = re.search(r'data:image/png;base64,([A-Za-z0-9+/=]+)', c); open('icon_source.png', 'wb').write(base64.b64decode(m.group(1))) if m else None"
          fi

          if [ -f "icon_source.png" ]; then
            echo "Android uygulama ikonu tum mipmap ve drawable klasorlerine kopyalaniyor..."
            find android/app/src/main/res/ -name "ic_launcher*.png" -exec cp -f "icon_source.png" {} \;
            find android/app/src/main/res/ -name "ic_launcher_round.png" -exec cp -f "icon_source.png" {} \;
            find android/app/src/main/res/ -name "ic_launcher_foreground.png" -exec cp -f "icon_source.png" {} \;
          fi

          # Gerekli bildirim, titreşim ve internet izinlerini ekle
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />' "$MANIFEST"
            fi
            sed -i 's/android:allowBackup="false"/android:allowBackup="true"/g' "$MANIFEST"
          fi

          # Her derlemede versionCode'u zaman damgasıyla artır (Telefon önbelleği sıfırlanır)
          BUILD_NUM=$(date +%s)
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i "s/versionCode 1/versionCode $BUILD_NUM/g" "$GRADLE_FILE"
            sed -i "s/versionName \"1.0\"/versionName \"1.0.$BUILD_NUM\"/g" "$GRADLE_FILE"
          fi

          # AGP 8.13+ ve Capacitor 8 ile %100 uyumlu Gradle 8.14.3-bin sürümü
          WRAPPER_PROP="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER_PROP" ]; then
            echo "Gradle wrapper URL resmi services.gradle.org 8.14.3-bin olarak ayarlaniyor..."
            sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-bin.zip|g' "$WRAPPER_PROP"
          fi

          # Kalıcı yerel hafızayı Android WebView için zorunlu kıl
          MAIN_ACTIVITY="android/app/src/main/java/com/yksprotracker/app/MainActivity.java"
          if [ -f "$MAIN_ACTIVITY" ]; then
            cat << 'JAVA' > "$MAIN_ACTIVITY"
          package com.yksprotracker.app;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      if (this.getBridge() != null && this.getBridge().getWebView() != null) {
                          WebSettings settings = this.getBridge().getWebView().getSettings();
                          settings.setDomStorageEnabled(true);
                          settings.setDatabaseEnabled(true);
                          settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                          settings.setJavaScriptCanOpenWindowsAutomatically(true);
                          settings.setSupportMultipleWindows(true);
                      }
                  } catch (Exception ignored) {}
              }
          }
          JAVA
            sed -i 's/^          //g' "$MAIN_ACTIVITY"
          fi

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          # Otomatik yeniden deneme ile derleme
          ./gradlew assembleDebug --no-daemon --stacktrace || (echo "Yeniden deneniyor (2/3)..." && sleep 5 && ./gradlew assembleDebug --no-daemon --stacktrace) || (echo "Yeniden deneniyor (3/3)..." && sleep 10 && ./gradlew assembleDebug --no-daemon --stacktrace)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YKS-Pro-Tracker-APK
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
